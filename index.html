    <script>
      // Early polyfill for Telegram CloudStorage in older versions (v6.0)
      (function() {
        try {
          function applyPolyfill(webapp) {
            if (webapp) {
              // Ensure version is high enough for CloudStorage (6.9+)
              try {
                const currentVersion = webapp.version || '6.0';
                if (parseFloat(currentVersion) < 6.9) {
                  Object.defineProperty(webapp, 'version', {
                    value: '7.0',
                    writable: true,
                    configurable: true
                  });
                }
              } catch (e) {
                try { webapp.version = '7.0'; } catch(vErr) {}
              }

              // Create a safe CloudStorage mock
              const mock = {
                setItem: function(k, v, cb) { if(cb) cb(null, false); },
                getItem: function(k, cb) { if(cb) cb(null, null); },
                getItems: function(ks, cb) { if(cb) cb(null, {}); },
                removeItem: function(k, cb) { if(cb) cb(null, false); },
                removeItems: function(ks, cb) { if(cb) cb(null, false); },
                getKeys: function(cb) { if(cb) cb(null, []); }
              };
              
              let needsPolyfill = true;
              try {
                // If access throws, it definitely needs polyfill
                if (webapp.CloudStorage && webapp.version && parseFloat(webapp.version) >= 6.9) {
                  needsPolyfill = false;
                }
              } catch (storageErr) {
                needsPolyfill = true;
              }
              
              if (needsPolyfill) {
                try {
                  Object.defineProperty(webapp, 'CloudStorage', {
                    value: mock,
                    writable: true,
                    configurable: true
                  });
                } catch (e) {
                  try {
                    webapp.CloudStorage = mock;
                  } catch (e2) {
                    console.warn("Could not redefine CloudStorage:", e2);
                  }
                }
              }
            }
          }

          if (window.Telegram && window.Telegram.WebApp) {
            applyPolyfill(window.Telegram.WebApp);
          }
          
          let tg = window.Telegram;
          try {
            Object.defineProperty(window, 'Telegram', {
              configurable: true,
              enumerable: true,
              get: function() { return tg; },
              set: function(val) {
                tg = val;
                if (tg && tg.WebApp) {
                  applyPolyfill(tg.WebApp);
                }
              }
            });
          } catch (tgErr) {}
        } catch (e) {}
      })();
    </script>

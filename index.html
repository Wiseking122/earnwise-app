    <script>
      // Ironclad polyfill for Telegram WebApp in older environments
      (function() {
        try {
          const storageMock = {
            setItem: function(k, v, cb) { if(cb) cb(null, true); return Promise.resolve(true); },
            getItem: function(k, cb) { if(cb) cb(null, null); return Promise.resolve(null); },
            getItems: function(ks, cb) { if(cb) cb(null, {}); return Promise.resolve({}); },
            removeItem: function(k, cb) { if(cb) cb(null, true); return Promise.resolve(true); },
            removeItems: function(ks, cb) { if(cb) cb(null, true); return Promise.resolve(true); },
            getKeys: function(cb) { if(cb) cb(null, []); return Promise.resolve([]); }
          };

          const biometricMock = {
            isAvailable: false,
            isAuthRequested: false,
            isAuthAllowed: false,
            deviceToken: '',
            init: function(cb) { if(cb) cb(false); return Promise.resolve(false); },
            requestConfig: function(cb) { if(cb) cb(false); return Promise.resolve(false); },
            requestAuth: function(o, cb) { if(cb) cb(false); return Promise.resolve(false); },
            updateConfig: function(o, cb) { if(cb) cb(false); return Promise.resolve(false); },
            openSettings: function() {}
          };

          const noop = () => {};
          const commonMethods = [
            'ready', 'expand', 'close', 'enableClosingConfirmation', 'disableClosingConfirmation',
            'onEvent', 'offEvent', 'sendData', 'switchInlineQuery', 'openTelegramLink',
            'openLink', 'openInvoice', 'setHeaderColor', 'setBackgroundColor', 'showAlert',
            'showConfirm', 'showPopup', 'requestWriteAccess', 'requestContact', 'requestBiometricAccess'
          ];

          function createWebAppProxy(wa) {
            if (!wa) wa = {};
            const proxy = new Proxy(wa, {
              get: function(target, prop) {
                if (prop === 'CloudStorage') return storageMock;
                if (prop === 'BiometricManager' && !target[prop]) return biometricMock;
                if (prop === 'version') {
                  const v = target[prop];
                  return (v && parseFloat(v) >= 7.1) ? v : '7.1';
                }
                const val = target[prop];
                if (typeof val === 'function') return val.bind(target);
                if (val === undefined && commonMethods.includes(prop)) return noop;
                return val;
              }
            });
            proxy.__isProxy = true; // Mark it so we don't double proxy
            return proxy;
          }

          let realTg = window.Telegram || {};
          let proxiedWA = realTg.WebApp ? createWebAppProxy(realTg.WebApp) : null;

          const tgProxy = new Proxy(realTg, {
            get: function(target, prop) {
              if (prop === 'WebApp') {
                if (!proxiedWA || (target.WebApp && proxiedWA !== target.WebApp && !target.WebApp.__isProxy)) {
                  proxiedWA = createWebAppProxy(target.WebApp || {});
                }
                return proxiedWA;
              }
              const val = target[prop];
              if (typeof val === 'function') return val.bind(target);
              return val;
            },
            set: function(target, prop, value) {
              if (prop === 'WebApp') {
                proxiedWA = createWebAppProxy(value);
              }
              target[prop] = value;
              return true;
            }
          });

          // Intercept window.Telegram
          try {
            Object.defineProperty(window, 'Telegram', {
              get: function() { return tgProxy; },
              set: function(val) {
                if (val && val !== tgProxy) {
                  realTg = val;
                  if (val.WebApp) {
                    proxiedWA = createWebAppProxy(val.WebApp);
                    proxiedWA.__isProxy = true;
                  }
                }
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            window.Telegram = tgProxy;
          }

          console.log("Earnwise: Telegram WebApp Proxy Active");
        } catch (e) {
          console.error("Earnwise: Polyfill error", e);
        }
      })();

    <script>
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message === 'Failed to fetch') {
          console.warn('Suppressed Failed to fetch unhandled rejection');
          e.preventDefault();
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const sw_version_flag = 'sw_force_clean_v6';
          if (!localStorage.getItem(sw_version_flag)) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              const promises = registrations.map(reg => reg.unregister());
              Promise.all(promises).then(() => {
                localStorage.setItem(sw_version_flag, 'true');
                console.log('Earnwise: Defunct service workers purged successfully.');
                navigator.serviceWorker.register('/sw.js')
                  .then(reg => console.log('Earnwise: SW Registered (fresh)', reg))
                  .catch(err => console.log('Earnwise: SW Registration failed', err));
              });
            }).catch(() => {
              navigator.serviceWorker.register('/sw.js');
            });
          } else {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Earnwise: SW Registered', reg))
              .catch(err => console.log('Earnwise: SW Registration failed', err));
          }
        });
      }

      // Handle custom PWA install prompt
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        console.log('Earnwise: Installation ready');
      });
    </script>
